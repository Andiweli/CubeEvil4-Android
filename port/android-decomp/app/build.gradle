plugins { id 'com.android.application' }

// ZIP timestamps have no timezone. A native input dated in the future keeps
// Ninja's CMake manifest perpetually out of date after regeneration.
def nativeSourceDirectory = layout.projectDirectory.dir('src/main/cpp').asFile
def normalizeNativeSourceTimestamps = tasks.register('normalizeNativeSourceTimestamps') {
    group = 'build'
    description = 'Corrects future native-source timestamps before native configure, build and clean.'
    // No outputs: this clock-dependent check must also run on incremental builds.
    doLast {
        long currentMillis = System.currentTimeMillis()
        int corrected = 0
        nativeSourceDirectory.eachFileRecurse(groovy.io.FileType.FILES) { File nativeInput ->
            if (nativeInput.lastModified() > currentMillis) {
                if (!nativeInput.setLastModified(currentMillis)) {
                    throw new GradleException("Cannot correct future timestamp: ${nativeInput}")
                }
                corrected++
            }
        }
        if (corrected > 0) {
            logger.lifecycle("Corrected future timestamps on ${corrected} native source files.")
        }
    }
}
tasks.configureEach { Task nativeTask ->
    // externalNativeBuildClean also invokes Ninja, which can regenerate CMake
    // before cleaning. It needs this preparation even for a standalone clean.
    if (nativeTask.name.startsWith('configureCMake') ||
            nativeTask.name.startsWith('buildCMake') ||
            nativeTask.name.startsWith('externalNativeBuild')) {
        nativeTask.dependsOn(normalizeNativeSourceTimestamps)
    }
}

android {
    namespace 'com.ast.re4decomp'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.ast.re4decomp'
        minSdk 21
        targetSdk 35
        versionCode 106
        // with the release's name: the app menu shows it ("(v0.41.0-alpha)", without the flavour's
        // suffix), the error report and the start screen as it is ("0.41.0-alpha-core"). Numbering
        // since 0.40.0 (decision of the project owner, 20.10.2026): each alpha raises the middle
        // number, a hotfix the last; versionCode counts on. After 0.46.0-alpha the beta 0.90.0
        // (decision of the project owner, 23.10.2026: the game was played through; published as
        // 0.90.0), then 0.90.1 (branch beta-optimisations), then 0.91.0 (decision of the project owner,
        // 26.10.2026: with the new menu and the instant save of gui-optimisations), then 0.92.0 (milestone 13:
        // the European discs, by the numbering above), then 0.93.0 (milestone 14: everything merged into
        // master, with the room tour 10b), then 0.94.0 (decision of the project owner, 28.10.2026: for further
        // tests; Hunk, the European chapter end and opening subtitles, 60 FPS by object), then 0.95.1 (a hotfix:
        // the tests of golden-master, 29.10.2026), then 0.95.2 (the reports of 29.10.2026: r214, r20e,
        // the handcannon, shaders built ahead), then 0.96.0 (decision of the project owner, 30.10.2026: the AUDIO
        // and CHEATS pages, Potato mode, save imports, the reports of 30.10.2026), then 0.96.1 (decision of the
        // project owner, 30.10.2026: the US discs, Auto aim / Always run, the reports of the evening), then 0.96.2
        // (decision of the project owner, 30.10.2026: the reports of the night, 0.96.1 was not published), then
        // 0.96.3 (wish of the project owner, 31.10.2026: the Mercenaries reports, the r101 key message), then 0.96.4
        // (wish of the project owner, 31.10.2026: r402 as the retail releases, music / effects off, Indonesian menu), then
        // 0.96.5 (wish of the project owner, 31.10.2026: the cannon's "aaa", the core process on 64 bit), then 0.96.6
        // (wish of the project owner, 01.11.2026: the crackle at displays just under 60 Hz, the r201 prison key), then
        // 0.96.7 (wish of the project owner, 01.11.2026: U-3's death after a retry, shader programs per room), then
        // 0.96.8 (a hotfix, wish of the project owner, 01.11.2026: the Mine Thrower cheat), then 0.96.9 (wish of the
        // project owner, 02.11.2026: music after a disc change, hut items, 60 FPS walls, tune-up sound, Blacktail), then
        // 0.97.0 (wish of the project owner, 02.11.2026: the PSone demake filter, Ashley hidden after an instant load,
        // Ada's hair after a beheading), then 0.98.0 (wish of the project owner, 03.11.2026: the story characters,
        // the retail shoulder camera, the attache case light crash; after 0.97.1 of 02.11.2026: the retail merchant, then 0.98.1 (wish of the
        // project owner, 04.11.2026: the Android 16 data folder, the PSone demake's textures, the gondola's instant save), then 0.98.2
        // (wish of the project owner, 04.11.2026: Android Automotive, the instant save in more rooms), then 0.98.3
        // (the tester reports of 05.11.2026: the stand-ins' own moves on the Ganados, HUNK's TMP and scope), then 0.98.4
        // (the menu rework, invisibility, field of view, the benchmark), then 0.98.5 (tester reports of 06.11.2026: the
        // magnums and the wooden doors, the Mercenaries rocket, the camera of the kip-up), then 0.98.6 (decision of the
        // project owner, 06.11.2026: the Japanese discs with the gore of the US release), then 0.98.7 (the laser sight
        // of the 60 FPS in-between pictures, made after 0.98.6 had been decided), then 0.99.0 (wish of the project owner,
        // 07.11.2026: the picture format "Native", the device's own aspect, on the widescreen of Noname267's fork;
        // released with the tag "0.99.0-rc"), then 0.99.1 (wish of the project owner, 07.11.2026: the life gauge and
        // the minimap in the corners, the update check), then 0.99.2 (the reports after 0.99.1), then 0.99.3
        // (the reports and wishes after 0.99.2), then 0.99.4 (the reports after 0.99.3). Since 0.99.1 the name
        // is exactly the release's tag on GitHub (AppUpdate compares the two): a suffix until 1.0 ("-rc"), none from 1.0
        // on (the project owner, 07.11.2026)
        versionName '0.99.4-rc'
        // a branch's test APK names itself with -Pre4.versionName (the Vulkan branch: "0.99.2-vulkan1"; AppUpdate
        // takes a different suffix word for the same version)
        if (project.hasProperty('re4.versionName')) versionName project.property('re4.versionName')
        // ... and its versionCode with -Pre4.versionCode (at least the installed release's, so it installs over it
        // by hand too)
        if (project.hasProperty('re4.versionCode')) versionCode Integer.parseInt(project.property('re4.versionCode').toString())
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    // classic: the app's own game modules (arm64-v8a), as before; since
    //   17.10.2026 app id "com.ast.re4decomp.classic" (installable next to the core app).
    // core: the original game core (port/whole) runs the whole game
    //   (armeabi-v7a and, since milestone 12, arm64-v8a in one APK). The app is called
    //   "CubeEvil4", app id "com.ast.cubeevil4" since 18.10.2026 (until then
    //   "com.ast.re4decomp", until 17.10.2026 "com.ast.re4decomp.core"; decisions of the
    //   project owner). The Java package (namespace) stays com.ast.re4decomp.
    //   Before building it, run in WSL/Linux:
    //   port/tools/whole_build_android.sh  (copies the core libraries to
    //   src/core/jniLibs/<abi>; see port/docs/whole-program-status.md)
    flavorDimensions 'engine'
    productFlavors {
        classic {
            dimension 'engine'
            applicationIdSuffix '.classic'
            ndk { abiFilters 'arm64-v8a' }
        }
        core {
            dimension 'engine'
            applicationId 'com.ast.cubeevil4'
            versionNameSuffix '-core'
            // the core's libraries load each other from the APK by name
            // (the module libraries at run time): Android 6.0 and later; since 0.98.2 Android 7.0 and later
            // (decision of the project owner, 04.11.2026: Google Play's automatic protection asks for SDK 24)
            minSdk 24
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
            externalNativeBuild { cmake { arguments '-DRE4_CORE_MODE=ON' } }
            // a test build of the app's shell for an x86_64 emulator (the Android Automotive emulator,
            // 04.11.2026): gradlew assembleCoreDebug -Pre4.emulatorAbi=x86_64. The game core has no x86_64
            // libraries; menus, windows and system bars can be checked, the game cannot start there.
            if (project.hasProperty('re4.emulatorAbi')) {
                ndk { abiFilters project.property('re4.emulatorAbi') }
                externalNativeBuild { cmake { arguments '-DRE4_EMULATOR_SHELL=ON' } }
            }
        }
        // car: the core app for Google Play's Android Automotive track (wish of the project owner, 04.11.2026) under
        //   the app id "com.ast.re4decomp" (the core app's until 18.10.2026); everything as "core" (its resources,
        //   libraries and assets from src/core), plus src/car: the automotive feature required, no self-update
        //   from GitHub (Google Play updates it; no REQUEST_INSTALL_PACKAGES). Built as carRelease / bundleCarRelease.
        car {
            dimension 'engine'
            applicationId 'com.ast.re4decomp'
            versionNameSuffix '-core'
            minSdk 24
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
            externalNativeBuild { cmake { arguments '-DRE4_CORE_MODE=ON' } }
        }
    }
    sourceSets {
        car {
            res.srcDirs = ['src/core/res', 'src/car/res']
            jniLibs.srcDirs = ['src/core/jniLibs']
            assets.srcDirs = ['src/core/assets']
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // the libraries extracted at installation (decision of the project owner, 20.10.2026): a 32-bit
    // device whose Java heap lies on MEM1 runs the core as a program of its own
    // (libre4_coreproc.so, port/docs/32bit-kernprozess.md), and Android runs programs only from
    // the extracted library folder. The APK gets smaller (libraries compressed), the installed
    // size stays about the same (only the device's ABI is extracted).
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // RetroTouch (MIT, github.com/Andiweli/RetroTouch): the touch controls of the core mode
    // (TouchControls). An update replaces libs/retrotouch.aar; the file name carries no version.
    // Now 1.0.0-beta.9 (03.11.2026, the AAR as the project owner built it in the RetroTouch repository): beta.8
    // (beta.7's stick actions for the analog C stick, docs/retrotouch-1.0.0-beta.7.patch, with
    // RetroTouchColors.withBorderColor and button shapes, RetroTouchButtonShape) with a border of 2.5 dp and
    // controls placed so that they stay on the screen with it (RetroTouchView.placeControl); the app's calls stay.
    implementation files('libs/retrotouch.aar')
}
