// CubeEvil4 Texture Packer for Android (wish of the project owner, 12.11.2026; port/docs/textur-packer-android-plan.md):
// an app of its own that turns a Dolphin texture pack (ZIP or folder) into the .c4tex file CubeEvil4 imports, with the
// PC tool's own C++ core (port/tools/texpack). No libraries, no AndroidX.
plugins { id 'com.android.application' }

android {
    namespace 'com.ast.cubeevil4.texturepacker'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.ast.cubeevil4.texturepacker'
        minSdk 24
        targetSdk 35
        // the packer's version (the PC tool's, packer.cpp kToolVersion)
        versionCode 1
        versionName '1.3'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
